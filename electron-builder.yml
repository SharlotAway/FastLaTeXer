appId: com.fastlatexer.desktop
productName: FastLaTeXer
directories:
  output: release
files:
  - dist/**
  - electron/**
  - '@themes/*.css'
  - '@themes/catalog.json'
  - '@themes/window.cjs'
  - build/icon.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  signExecutable: false
  artifactName: FastLaTeXer-Setup-${version}-${arch}.${ext}
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
